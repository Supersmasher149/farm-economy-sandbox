[project]
name = "farm-economy-sandbox"
version = "0.1.0"
description = "A headless, deterministic farm-economy simulator for balance testing, not a playable game."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Walter Gibbons" }]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "metrics", "runner", "simulation"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
