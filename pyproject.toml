[project]
name = "farm-economy-sandbox"
version = "0.1.0"
description = "A headless, deterministic farm-economy simulator for balance testing, not a playable game."
readme = "README.md"
# 3.12, not 3.11: simulation/crop_growth.py depends on sum() applying Neumaier
# compensated summation to floats, which CPython only does from 3.12. On 3.11
# the same seed produces a different run -- verified, it moves 1 of the 44
# combos in .claude/skills/replay-guard/golden_baseline.json.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Walter Gibbons" }]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "metrics", "runner", "simulation"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
