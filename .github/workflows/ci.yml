name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is the floor: simulation/crop_growth.py depends on sum()
        # applying Neumaier compensated summation to floats, which CPython
        # only does from 3.12. See README's Requirements section.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python3 -m pytest

      - name: Lint (ruff check)
        run: ruff check

      - name: Format check (ruff format)
        run: ruff format --check

  # The pure-Python jobs above never build the C accelerator, so every test in
  # tests/test_fastplot_equivalence.py is skipped there and nothing checks the
  # compiled path at all. This job is the one that does.
  compiled:
    strategy:
      fail-fast: false
      matrix:
        # macOS included because the darwin `-undefined dynamic_lookup` branch
        # in tools/build_fastplot.py is otherwise only exercised by hand.
        os: [ubuntu-latest, macos-latest]
        # Both ends of the supported range, not just the newest: the accelerator
        # is compiled against whichever CPython headers are present, and the
        # floor is the version most likely to be running in an old environment.
        # 3.13 is left to the pure-Python matrix -- four compiled jobs is
        # already the expensive half of this workflow.
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build the C accelerator
        run: python3 tools/build_fastplot.py

      - name: Run tests against the compiled kernel
        # FARM_REQUIRE_COMPILED turns "extension missing" from a skip into a
        # failure. Without it a silently broken build produces a green run in
        # which every equivalence test was skipped.
        env:
          FARM_REQUIRE_COMPILED: "1"
        run: python3 -m pytest

      - name: Golden replay check
        # The committed baseline is captured from the pure-Python reference,
        # so this asserts the C kernel reproduces it bit for bit.
        run: python3 .claude/skills/replay-guard/scripts/golden_replay.py check

  # The Cython build is optional and off by default, so nothing above touches
  # it. FARM_COMPILED=strict makes a missing or stale artifact an error rather
  # than a silent fall back to pure Python.
  cython:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cython's generated C is ABI-specific, and the manifest's build tag
        # is what keeps artifacts for one interpreter from loading under
        # another -- worth exercising on more than one.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        # Cython is pinned: a minor bump that changes a codegen default is
        # exactly the silent-drift scenario this project cannot absorb.
        run: |
          pip install -r requirements-dev.txt
          pip install "cython==3.2.9"

      - name: Build both accelerators
        run: |
          python3 tools/build_fastplot.py
          python3 tools/build_cython.py

      - name: Run tests against the compiled modules
        env:
          FARM_COMPILED: strict
          FARM_REQUIRE_COMPILED: "1"
        run: python3 -m pytest

      - name: Golden replay check
        # The baseline is captured from the pure-Python reference, so this
        # asserts the Cython build reproduces it bit for bit.
        env:
          FARM_COMPILED: strict
        run: python3 .claude/skills/replay-guard/scripts/golden_replay.py check

  # Determinism is a property of the reference implementation too, and the
  # committed baseline is portable across 3.12+ (verified). A divergence here
  # is a real regression, not a platform artifact -- so this runs on *every*
  # supported interpreter. It needs no dependencies and takes under a second,
  # which is why it gets the full matrix where the compiled jobs do not.
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Golden replay check (pure Python reference)
        run: python3 .claude/skills/replay-guard/scripts/golden_replay.py check

  # tests/test_visualize.py skips itself when matplotlib is absent, which is
  # every job above. Without this one, the chart tests would be present in the
  # repo and never actually run anywhere.
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev and visualization dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements-viz.txt

      - name: Fail loudly if matplotlib is missing
        # Otherwise the import guard in tests/test_visualize.py turns a broken
        # install into a green run with every chart test skipped.
        run: python3 -c "import matplotlib; print(matplotlib.__version__)"

      - name: Render every chart
        run: python3 -m pytest tests/test_visualize.py

  # tests/test_vectorized.py skips itself when numpy/numba are absent, which
  # is every job above -- vectorized/ is optional, see requirements-fast.txt
  # and vectorized/README.md's "Why this is a separate tool". Without this
  # job, scripts/vectorized_validate.py's kernel-vs-reference checks would
  # never actually run in CI, only whenever someone remembers to run the
  # script by hand.
  vectorized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev and vectorized-sampler dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements-fast.txt

      - name: Fail loudly if numpy/numba are missing
        # Otherwise the importorskip guard in tests/test_vectorized.py turns
        # a broken install into a green run with every check skipped.
        run: python3 -c "import numba, numpy; print(numpy.__version__, numba.__version__)"

      - name: Kernel-vs-reference validation (component E)
        run: python3 -m pytest tests/test_vectorized.py

  # ---------------------------------------------------------------------------
  # farm-c: the pure-C port. Nothing above touches it -- every job so far runs
  # Python, and the C tree has its own Makefile, its own test binaries and its
  # own committed replay baseline. Until these two jobs existed the port was
  # verified only by whoever remembered to run `make test` locally.
  # ---------------------------------------------------------------------------

  # Gate 1: the C reproduces its committed baseline. Needs no Python at all,
  # which is the point -- it is the gate that still works on a machine or a
  # job that has no interpreter and no live Python tree.
  #
  # The matrix is about libc and codegen, not about coverage for its own sake:
  # pyfloat.c's py_round_ndigits is a *deliberate* dependency on the host
  # libc's snprintf/strtod being correctly rounded (see its header comment), so
  # "does this still hold on the other platform's libc" is a real question that
  # only a second platform can answer. glibc and Darwin's libc are the two this
  # port actually targets. macOS `gcc` is a clang shim, so pairing it there
  # would buy nothing and is left out rather than padding the matrix.
  farm-c:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: gcc}
          - {os: ubuntu-latest, cc: clang}
          - {os: macos-latest, cc: clang}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: farm-c
    steps:
      - uses: actions/checkout@v4

      # Builds every test binary under ASan+UBSan, runs all twelve, then diffs
      # every (strategy, seed) combo against tests/golden_baseline.json.
      - name: Build and test (ASan+UBSan) + golden replay
        env:
          CC: ${{ matrix.cc }}
        run: make test

      # The suite above is -O0 with sanitizers. -ffp-contract=off is what stops
      # an optimizer from fusing `a + (b - a) * x` into a single rounded FMA
      # where Python does two roundings -- and that only has teeth at -O2, so a
      # matrix that never optimizes never tests the flag that matters most.
      # `make test` above already runs this via the golden-check-profile
      # target, so it is redundant on the happy path -- kept as its own step
      # so that when it is the -O2 build that drifts, the failure is named
      # rather than buried at the end of the test log.
      - name: Golden replay against the -O2 build
        env:
          CC: ${{ matrix.cc }}
        run: make golden-check-profile

  # Gate 2: that committed baseline is what *Python* produces. Without this,
  # a baseline captured from an already-drifted C would lock the drift in and
  # gate 1 would agree with it forever after.
  #
  # `check` compares 20 end-of-run scalars run-for-run; `baseline` additionally
  # compares the chained per-day trajectory digest, which is what catches a
  # divergence that cancels out before the final tally.
  farm-c-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range. Exact float results are not
        # guaranteed portable across interpreter versions (3.12 is the floor
        # for sum()'s Neumaier compensation), so "the C matches Python" has to
        # mean "matches every Python this repo supports", not just the newest.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # c_parity.py imports the simulator directly and is stdlib-only, like
      # the rest of the reporting path -- no requirements install needed.
      - name: Build farm-c
        working-directory: farm-c
        run: make farm-c

      - name: Run-for-run field parity (farm-c vs Python)
        run: python3 .claude/skills/c-parity/scripts/c_parity.py check --runs 20 --progress

      - name: Verify the committed C baseline against Python
        run: python3 .claude/skills/c-parity/scripts/c_parity.py baseline --progress
